<svg xmlns="http://www.w3.org/2000/svg" width="850" height="176" viewBox="0 0 850 176">
  <defs>
    <pattern id="intro-grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#34372e" stroke-width="0.5" opacity="0.16"/>
    </pattern>
    <filter id="intro-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="849" height="175" rx="12" fill="#11120f" stroke="#34372e"/>
  <rect x="1" y="1" width="848" height="174" rx="11" fill="url(#intro-grid)"/>

  <text x="24" y="23" fill="#64675d" font-size="8" font-family="monospace" letter-spacing="2">PROFILE SIGNAL / 2026</text>
  <g transform="translate(731 18)">
    <circle cx="0" cy="0" r="3" fill="#d8f85b" filter="url(#intro-glow)">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="10" y="3" fill="#64675d" font-size="8" font-family="monospace" letter-spacing="1">AVAILABLE</text>
  </g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.0s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 -5" to="0 0" dur="0.45s" begin="0.0s" fill="freeze"/>    <rect x="268.0" y="36" width="134" height="24" rx="5" fill="#181a16" stroke="#d8f85b" stroke-opacity="0.55"/>    <circle cx="280.0" cy="48" r="2.5" fill="#d8f85b"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle>    <text x="340.0" y="52" fill="#f2f0e8" font-size="10" font-family="monospace" text-anchor="middle">DATA ENGINEERING</text>  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.16s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 -5" to="0 0" dur="0.45s" begin="0.16s" fill="freeze"/>    <rect x="415.0" y="36" width="76" height="24" rx="5" fill="#181a16" stroke="#ff795c" stroke-opacity="0.55"/>    <circle cx="427.0" cy="48" r="2.5" fill="#ff795c"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0.16s" repeatCount="indefinite"/></circle>    <text x="458.0" y="52" fill="#f2f0e8" font-size="10" font-family="monospace" text-anchor="middle">CLOUD</text>  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.32s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 -5" to="0 0" dur="0.45s" begin="0.32s" fill="freeze"/>    <rect x="504.0" y="36" width="78" height="24" rx="5" fill="#181a16" stroke="#91b7ff" stroke-opacity="0.55"/>    <circle cx="516.0" cy="48" r="2.5" fill="#91b7ff"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0.32s" repeatCount="indefinite"/></circle>    <text x="548.0" y="52" fill="#f2f0e8" font-size="10" font-family="monospace" text-anchor="middle">BIG DATA</text>  </g>

  <text x="425.0" y="96" fill="#f2f0e8" font-size="21" font-weight="600" font-family="sans-serif" text-anchor="middle">Dados que aguentam o mundo real.</text>
  <text x="425.0" y="121" fill="#a3a49a" font-size="11" font-family="sans-serif" text-anchor="middle">Do byte bruto à camada analítica — pipelines observáveis, cloud e sistemas de dados que sustentam decisões.</text>

  <line x1="80" y1="153" x2="770" y2="153" stroke="#34372e" stroke-width="1" stroke-dasharray="3 8"/>
  <circle cx="80" cy="153" r="3" fill="#11120f" stroke="#d8f85b"/>
  <circle cx="770" cy="153" r="3" fill="#11120f" stroke="#ff795c"/>
  <circle cx="0" cy="153" r="2" fill="#d8f85b">    <animate attributeName="cx" from="80" to="770" dur="6.5s" begin="0.0s" repeatCount="indefinite"/>    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="6.5s" begin="0.0s" repeatCount="indefinite"/>  </circle>
  <circle cx="0" cy="153" r="2" fill="#ff795c">    <animate attributeName="cx" from="80" to="770" dur="6.5s" begin="-2.15s" repeatCount="indefinite"/>    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="6.5s" begin="-2.15s" repeatCount="indefinite"/>  </circle>
  <circle cx="0" cy="153" r="2" fill="#91b7ff">    <animate attributeName="cx" from="80" to="770" dur="6.5s" begin="-4.3s" repeatCount="indefinite"/>    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="6.5s" begin="-4.3s" repeatCount="indefinite"/>  </circle>
</svg>