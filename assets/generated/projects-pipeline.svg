<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
  <title id="title">Seis projetos autorais de engenharia de dados</title>
  <desc id="desc">Painel com links para CineLake IMDb, VulnWatch Intelligence, TerraLake ERA5-Land, ChangeFlow CDC, AuditStream Security e DependencyAtlas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11120f"/><stop offset="1" stop-color="#181a16"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#34372e" stroke-width="1" opacity=".42"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .card { fill: #151713; stroke: #34372e; stroke-width: 1; }
      .name { fill: #f2f0e8; font: 700 18px sans-serif; }
      .copy { fill: #a3a49a; font: 12px sans-serif; }
      .meta { fill: #64675d; font: 10px monospace; letter-spacing: 1.2px; }
      .tag { fill: #11120f; font: 10px monospace; letter-spacing: .7px; }
    </style>
  </defs>
  <rect x="1" y="1" width="1098" height="468" rx="14" fill="url(#bg)" stroke="#34372e"/>
  <rect x="1" y="1" width="1098" height="468" rx="14" fill="url(#grid)" opacity=".34"/>
